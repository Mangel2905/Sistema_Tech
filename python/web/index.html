<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechPOS · Asesor</title>
  <meta name="description" content="Asesor conversacional de tecnología: recomendaciones con Prolog, catálogo con Scala y backend en Python.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem("techpos-tema"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
  </script>
</head>
<body>
  <!-- iconos (Lucide, licencia ISC) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.38 3.62a1 1 0 0 1 3 3L7.37 18.64a2 2 0 0 1-.86.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.86z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></symbol>
  </svg>

  <div class="app">
    <header class="barra">
      <div class="marca">
        <span class="logo" aria-hidden="true"><svg><use href="#i-chip"/></svg></span>
        <div>
          <p class="marca-nombre">TechPOS</p>
          <p class="marca-sub">Asesor de tecnología</p>
        </div>
      </div>
      <div class="barra-acciones">
        <span class="perfil" id="perfil" hidden></span>
        <button class="icono-btn" id="btn-carrito" type="button" aria-label="Ver carrito" title="Ver carrito" disabled>
          <svg><use href="#i-cart"/></svg>
          <span class="badge" id="badge" hidden>0</span>
        </button>
        <button class="icono-btn" id="btn-tema" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="solo-claro"><use href="#i-moon"/></svg>
          <svg class="solo-oscuro"><use href="#i-sun"/></svg>
        </button>
        <button class="icono-btn" id="btn-nueva" type="button" aria-label="Nueva conversación" title="Nueva conversación">
          <svg><use href="#i-new"/></svg>
        </button>
      </div>
    </header>

    <main class="conversacion" id="conversacion">
      <div class="hilo" id="hilo" role="log" aria-live="polite" aria-label="Conversación con el asesor"></div>
    </main>

    <footer class="composer-zona">
      <form class="composer" id="composer" autocomplete="off">
        <label for="entrada" class="sr-only">Mensaje</label>
        <textarea id="entrada" rows="1" placeholder="Escribe un mensaje…" maxlength="500"></textarea>
        <button class="enviar" id="enviar" type="submit" aria-label="Enviar" disabled>
          <svg><use href="#i-send"/></svg>
        </button>
      </form>
      <p class="pie">Recomendaciones con <strong>Prolog</strong> · catálogo y reportes con <strong>Scala</strong> · backend <strong>Python + FastAPI</strong></p>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
